# HTTP server port for the application (defaults to 8080, overridden by the PORT environment variable)
server:
  port: ${PORT:8080}

spring:
  application:
    # Application name in the Spring Boot context
    name: SweetStory
  datasource:
    # JDBC connection URL for the PostgreSQL database
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cake_db}
    # Database username
    username: ${DB_USERNAME:postgres}
    # Database password
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # Automatic Hibernate schema update strategy (defaults to update)
      ddl-auto: ${DDL_AUTO:update}
    # Disable Open Session in View to prevent lazy loading outside transactions
    open-in-view: false
    properties:
      hibernate:
        # Format generated SQL queries in logs for readability
        format_sql: true

app:
  jwt:
    # Secret key for signing and verifying JWT tokens (set via JWT_SECRET in production)
    secret: ${JWT_SECRET:dev-only-very-long-secret-key-change-in-production-123456}
    # JWT token lifetime in milliseconds (86400000 ms = 24 hours)
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    # Secure flag for the token cookie (true for HTTPS, false for local HTTP development)
    cookie-secure: ${JWT_COOKIE_SECURE:false}
    # SameSite policy for the token cookie (defaults to Lax)
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}
  cors:
    # List of allowed frontend origins for cross-origin requests (CORS)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://sweetstory-sigma.vercel.app}