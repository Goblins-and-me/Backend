$kind: http-request
url: "{{base_url}}/api/auth/login"
method: POST
body:
  type: json
  content: "{\r

    \  \"email\": \"Wrong@wrong.wrong\",\r

    \  \"password\": \"WrongPassword999\"\r

    }\r\n"
scripts:
  - type: afterResponse
    code: "pm.test(\"Ошибка авторизации при неправильном email (4xx)\", () => {\r

      \    pm.expect(pm.response.code).to.be.within(400, 499);\r

      });\r

      \r

      pm.test(\"Заголовок Set-Cookie не отправлен\", () => {\r

      \    pm.expect(pm.response.headers.has(\"Set-Cookie\")).to.be.false;\r

      });\r\n"
    language: text/javascript
order: 4000
