$kind: http-request
name: Logout User
url: "{{base_url}}/api/auth/logout"
method: POST
scripts:
  - type: afterResponse
    code: "pm.test(\"Статус 200 OK\", () => pm.response.to.have.status(200));\r

      \r

      pm.test(\"Кука очищена (Max-Age=0)\", () => {\r

      \    const setCookie = pm.response.headers.get(\"Set-Cookie\");\r

      \    const name = pm.collectionVariables.get(\"auth_cookie_name\");\r

      \    pm.expect(setCookie).to.include(`${name}=;`);\r

      \    pm.expect(setCookie).to.include(\"Max-Age=0\");\r

      });\r\n"
    language: text/javascript
order: 3000
