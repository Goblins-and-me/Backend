$kind: http-request
url: "{{base_url}}/api/admin/orders"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Статус 200 OK\", () => pm.response.to.have.status(200));\r

      pm.test(\"Заказ виден админу с данными клиента\", () => {\r

      \    const json = pm.response.json();\r

      \    const order = json.orders.find(o => o.id === Number(pm.collectionVariables.get(\"order_id\")));\r

      \    pm.expect(order).to.be.an(\"object\");\r

      \    pm.expect(order.customer.email).to.eql(pm.collectionVariables.get(\"user_email\"));\r

      });\r\n"
    language: text/javascript
order: 10000
