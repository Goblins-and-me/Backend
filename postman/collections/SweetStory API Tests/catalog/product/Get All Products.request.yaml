$kind: http-request
url: "{{base_url}}/api/products"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Статус 200 OK\", () => pm.response.to.have.status(200));\r

      \r

      pm.test(\"Контракт ProductListResponse и ProductSummaryResponse
      соблюден\", () => {\r

      \    const json = pm.response.json();\r

      \    pm.expect(json).to.have.property(\"items\");\r

      \    pm.expect(json.items).to.be.an(\"array\").that.is.not.empty;\r

      \r

      \    const created = json.items.find(p => p.id ===
      Number(pm.collectionVariables.get(\"product_id\")));\r

      \    pm.expect(created).to.be.an(\"object\");\r

      \    pm.expect(created).to.have.all.keys(\"id\", \"name\", \"image_url\",
      \"description\", \"cake_price\");\r

      \    pm.expect(created.image_url).to.eql(\"https://example.com\");\r

      });\r\n"
    language: text/javascript
order: 9000
