$kind: http-request
url: "{{base_url}}/api/auth/login"
method: POST
body:
  type: json
  content: "{\r

    \  \"email\": \"{{admin_email}}\",\r

    \  \"password\": \"{{admin_password}}\"\r

    }\r\n"
scripts:
  - type: afterResponse
    code: "pm.test(\"Статус 200 OK\", () => pm.response.to.have.status(200));\r

      \r

      pm.test(\"Кука access_token установлена\", () => {\r

      \    pm.expect(pm.cookies.has(\"access_token\")).to.be.true;\r

      \    pm.expect(pm.cookies.get(\"access_token\")).to.be.a(\"string\").and.\
      not.be.empty;\r

      });\r

      \r

      pm.test(\"Аккаунт имеет права администратора\", () => {\r

      \    const json = pm.response.json();\r

      \    pm.expect(json.user.is_admin).to.eql(true);\r

      });"
    language: text/javascript
  - type: beforeRequest
    code: "pm.cookies.jar().clear(pm.collectionVariables.get(\"base_url\"), () =>
      {});\r\n"
    language: text/javascript
order: 4000
