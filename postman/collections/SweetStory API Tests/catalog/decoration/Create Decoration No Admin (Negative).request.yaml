$kind: http-request
url: "{{base_url}}/api/admin/decorations"
method: POST
body:
  type: json
  content: "{\r

    \  \"name\": \"{{$randomProductName}}\",\r

    \  \"description\": \"{{$randomProductAdjective}}\",\r

    \  \"price\": {{$randomPrice}}\r

    }\r\n"
scripts:
  - type: afterResponse
    code: "pm.test(\"Доступ запрещен без прав администратора (401 или 403)\", () =>
      {\r

      \    pm.expect(pm.response.code).to.be.oneOf([401, 403]);\r

      });\r\n"
    language: text/javascript
order: 2000
