$kind: http-request
url: "{{base_url}}/api/fillings/{{filling_id}}"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Статус 200 OK\", () => pm.response.to.have.status(200));\r

      \r

      pm.test(\"Контракт FillingResponse совпадает\", () => {\r

      \    const json = pm.response.json();\r

      \    pm.expect(json.id).to.eql(Number(pm.collectionVariables.get(\"fillin\
      g_id\")));\r

      \    pm.expect(json).to.have.all.keys(\"id\", \"name\", \"description\",
      \"price\");\r

      \    pm.expect(json.name).to.eql(pm.collectionVariables.get(\"filling_name\
      \"));\r

      });\r\n"
    language: text/javascript
order: 8000
