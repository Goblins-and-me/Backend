name: user-service
services:
  pg:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${PG_NAME}
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_USER: ${PG_USER}
    ports:
      - 127.0.0.1:5436:5432
    volumes:
      - user_service_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 3


volumes:
  user_service_db: