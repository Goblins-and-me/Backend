name: user-service
services:
  app:
    build: .
    env_file:
      - .env.docker
    ports:
      - "8005:8000"
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /app/app
        - action: rebuild
          path: ./poetry.lock

  pg:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${PG_NAME}
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_USER: ${PG_USER}
    ports:
      - 127.0.0.1:5436:5432
    volumes:
      - user_service_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - user_service_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 3
      timeout: 3s

volumes:
  user_service_db:
  user_service_redis: